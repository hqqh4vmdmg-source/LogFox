name: Staging
on:
  workflow_dispatch:
  push:
    branches:
      - master
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
 steps:
   - name: Checkout
     uses: actions/checkout@v6
     with:
       fetch-depth: 0
        
build:
  name: Build APK
  uses: ./.github/workflows/build_apk_job.yml
  with:
    checkout_keystore: false
send:
  name: Send APK
  runs-on: ubuntu-latest
  needs: build
  steps:
    - name: Download APK
      uses: actions/download-artifact@v4
      with:
        name: logfox-release
        path: ./apk
  ```
  
